<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>A · Cisza — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
h2 a:hover{text-decoration:underline !important}
</style>
</helmet>
<div style="min-height: 820px; background: {{t.bg}}; color: {{t.fg}}; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5;">
<div style="max-width: 760px; margin: 0 auto; padding: 56px 24px 40px; display: flex; flex-direction: column; gap: 32px;">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#ff1493"></rect><g fill="#ffffff"><rect x="7" y="14" width="18" height="11" rx="1.5"></rect><rect x="6" y="10" width="20" height="5" rx="1.5"></rect></g><rect x="14.75" y="10" width="2.5" height="15" fill="#ff1493"></rect><path d="M16 10c-2-4-6-4-6-1.5S14 10 16 10zm0 0c2-4 6-4 6-1.5S18 10 16 10z" fill="none" stroke="#ffffff" stroke-width="1.8"></path></svg>
<h1 style="margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em;">chce</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{t.line}}; background: transparent; color: {{t.fg}}; font: inherit; font-size: 14px; cursor: pointer;">+ zakładka</button>
<button type="button" style="height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid {{t.line}}; background: transparent; color: {{t.fg}}; font: inherit; font-size: 14px; cursor: pointer;">Edytuj zakładkę</button>
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid {{t.acc}}; background: {{t.acc}}; color: {{t.onAcc}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">+ pozycja</button>
</div>
</header>
<nav aria-label="Zakładki" style="display: flex; gap: 24px; border-bottom: 1px solid {{t.line}};">
<a href="#" aria-current="page" style="padding: 0 0 10px; margin-bottom: -1px; border-bottom: 2px solid {{t.acc}}; color: {{t.fg}}; text-decoration: none; font-weight: 600;">Przykład</a>
</nav>
<ul style="list-style: none; margin: -12px 0 0; padding: 0; display: flex; flex-direction: column;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="2">
<li style="display: flex; gap: 20px; align-items: flex-start; padding: 20px 0; border-bottom: 1px solid {{t.line}};">
<div style="flex: 0 0 88px; height: 88px; border-radius: 10px; background: {{t.tile}}; color: #8a8285; display: flex; align-items: center; justify-content: center;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; gap: 16px; align-items: baseline; justify-content: space-between;">
<h2 style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35;"><a href="{{item.url}}" style="color: {{t.fg}}; text-decoration: none;">{{item.title}}</a></h2>
<span style="flex: 0 0 auto; font-weight: 600; font-variant-numeric: tabular-nums;">{{item.price}}</span>
</div>
<p style="margin: 0; font-size: 14px; color: {{t.muted}};">Znajdź w: <a href="{{item.url}}" style="color: {{t.fg}}; text-decoration-color: {{t.muted}}; text-underline-offset: 3px;">{{item.shop}}</a> · <a href="{{item.ceneo}}" style="color: {{t.fg}}; text-decoration-color: {{t.muted}}; text-underline-offset: 3px;">Ceneo</a> · <a href="{{item.allegro}}" style="color: {{t.fg}}; text-decoration-color: {{t.muted}}; text-underline-offset: 3px;">Allegro</a> · <a href="{{item.google}}" style="color: {{t.fg}}; text-decoration-color: {{t.muted}}; text-underline-offset: 3px;">Google Shopping</a></p>
</div>
<button type="button" aria-label="Edytuj pozycję" style="flex: 0 0 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
</button>
</li>
</sc-for>
</ul>
<footer style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: {{t.muted}};">
<a href="#" style="color: {{t.muted}}; text-underline-offset: 3px;">Bookmarklet</a>
<button type="button" style="height: 40px; padding: 0; border: 0; background: transparent; color: {{t.muted}}; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;">Wyloguj</button>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const P = {
light: { bg: '#faf8f5', tile: '#ffffff', fg: '#231f20', muted: '#6b6466', line: '#e7e1e3', acc: '#a8476f', onAcc: '#ffffff' },
dark: { bg: '#161514', tile: '#f1edee', fg: '#efeaec', muted: '#a9a1a4', line: '#34302f', acc: '#e3a1bd', onAcc: '#161514' }
};
const items = [
{ title: 'Książka A', price: '49,99 zł', shop: 'shop.example', url: 'https://shop.example/' },
{ title: 'Kubek z długą nazwą, żeby sprawdzić zawijanie tytułu', price: '29,00 €', shop: 'sklep.example', url: 'https://sklep.example/' }
].map((i) => {
const q = encodeURIComponent(i.title);
return { ...i, ceneo: 'https://www.ceneo.pl/;szukaj-' + q, allegro: 'https://allegro.pl/listing?string=' + q, google: 'https://www.google.com/search?tbm=shop&q=' + q };
});
return { t: (this.props.dark ?? true) ? P.dark : P.light, items };
}
}
</script>
</body>
</html>
