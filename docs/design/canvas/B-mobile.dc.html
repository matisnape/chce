<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>B · Galeria — telefon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5; padding: 24px 16px 88px; display: flex; flex-direction: column; gap: 20px;">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#ff1493"></rect><g fill="#ffffff"><rect x="7" y="14" width="18" height="11" rx="1.5"></rect><rect x="6" y="10" width="20" height="5" rx="1.5"></rect></g><rect x="14.75" y="10" width="2.5" height="15" fill="#ff1493"></rect><path d="M16 10c-2-4-6-4-6-1.5S14 10 16 10zm0 0c2-4 6-4 6-1.5S18 10 16 10z" fill="none" stroke="#ffffff" stroke-width="1.8"></path></svg>
<h1 style="margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em;">chce</h1>
</div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 14px; color: {{t.muted}};">
<a href="#" style="color: {{t.muted}}; text-underline-offset: 3px; padding: 12px 0;">Bookmarklet</a>
<button type="button" style="height: 44px; padding: 0; border: 0; background: transparent; color: {{t.muted}}; font: inherit; text-decoration: underline; text-underline-offset: 3px;">Wyloguj</button>
</div>
</header>
<nav aria-label="Zakładki" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
<a href="#" aria-current="page" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: {{t.chipBg}}; color: {{t.chipFg}}; text-decoration: none; font-size: 15px; font-weight: 600;">Przykład</a>
<div style="position: relative;">
<button type="button" aria-label="Opcje zakładek" aria-haspopup="menu" aria-expanded="{{menuExpanded}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" style="position: absolute; top: 50px; left: 0; z-index: 2; min-width: 230px; padding: 6px; border-radius: 12px; background: {{t.bg}}; border: 1px solid {{t.line}}; box-shadow: 0 8px 24px rgb(0 0 0 / 0.25); display: flex; flex-direction: column;">
<button type="button" role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: {{t.fg}}; font: inherit; font-size: 15px; text-align: left;">Edytuj zakładkę „Przykład”</button>
<button type="button" role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: {{t.fg}}; font: inherit; font-size: 15px; text-align: left;">Nowa zakładka</button>
</div>
</sc-if>
</div>
</nav>
<ul style="list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="2">
<li style="display: flex; flex-direction: column; gap: 10px; min-width: 0;">
<div style="position: relative; aspect-ratio: 1 / 1; border-radius: 14px; background: {{t.tile}}; color: #8a8285; display: flex; align-items: center; justify-content: center;">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
<button type="button" aria-label="Edytuj pozycję" style="position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border-radius: 999px; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
</button>
</div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35;"><a href="{{item.url}}" style="color: {{t.fg}}; text-decoration: none;">{{item.title}}</a></h2>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{item.price}}</span>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: {{t.muted}};">Znajdź w: <a href="{{item.url}}" style="color: {{t.muted}}; text-underline-offset: 3px;">{{item.shop}}</a> · <a href="{{item.ceneo}}" style="color: {{t.muted}}; text-underline-offset: 3px;">Ceneo</a> · <a href="{{item.allegro}}" style="color: {{t.muted}}; text-underline-offset: 3px;">Allegro</a> · <a href="{{item.google}}" style="color: {{t.muted}}; text-underline-offset: 3px;">Google Shopping</a></p>
</div>
</li>
</sc-for>
</ul>
<button type="button" style="position: absolute; right: 16px; bottom: 16px; height: 56px; padding: 0 22px 0 16px; border-radius: 999px; border: 0; background: {{t.acc}}; color: {{t.onAcc}}; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.28);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Dodaj
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const P = {
light: { bg: '#ffffff', tile: '#f4f1f2', fg: '#1f1b1d', muted: '#6b6466', line: '#ebe5e8', acc: '#9d4a6b', onAcc: '#ffffff', chipBg: '#f6e4ec', chipFg: '#7d2f52' },
dark: { bg: '#1c1a1b', tile: '#ece7e9', fg: '#f1ecee', muted: '#a9a1a4', line: '#353033', acc: '#d9a3b8', onAcc: '#1c1a1b', chipBg: '#3b2a32', chipFg: '#f3d5e2' }
};
const items = [
{ title: 'Książka A', price: '49,99 zł', shop: 'shop.example', url: 'https://shop.example/' },
{ title: 'Kubek z długą nazwą, żeby sprawdzić zawijanie tytułu', price: '29,00 €', shop: 'sklep.example', url: 'https://sklep.example/' }
].map((i) => {
const q = encodeURIComponent(i.title);
return { ...i, ceneo: 'https://www.ceneo.pl/;szukaj-' + q, allegro: 'https://allegro.pl/listing?string=' + q, google: 'https://www.google.com/search?tbm=shop&q=' + q };
});
const menuOpen = !!(this.state && this.state.menuOpen);
return { t: (this.props.dark ?? true) ? P.dark : P.light, items, menuOpen, menuExpanded: menuOpen ? 'true' : 'false', toggleMenu: () => this.setState({ menuOpen: !menuOpen }) };
}
}
</script>
</body>
</html>
