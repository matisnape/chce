<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>C · telefon — arkusz od dołu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5; display: flex; flex-direction: column;">
<div style="background: {{t.side}}; border-bottom: 1px solid {{t.line}}; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#ff1493"></rect><g fill="#ffffff"><rect x="7" y="14" width="18" height="11" rx="1.5"></rect><rect x="6" y="10" width="20" height="5" rx="1.5"></rect></g><rect x="14.75" y="10" width="2.5" height="15" fill="#ff1493"></rect><path d="M16 10c-2-4-6-4-6-1.5S14 10 16 10zm0 0c2-4 6-4 6-1.5S18 10 16 10z" fill="none" stroke="#ffffff" stroke-width="1.8"></path></svg>
<span style="font-family: ui-serif, Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 600;">chce</span>
</div>
<div style="display: flex; align-items: center; gap: 16px; font-size: 14px; color: {{t.muted}};">
<a href="#" style="color: {{t.muted}}; text-underline-offset: 3px; padding: 12px 0;">Bookmarklet</a>
<button type="button" style="height: 44px; padding: 0; border: 0; background: transparent; color: {{t.muted}}; font: inherit; text-decoration: underline; text-underline-offset: 3px;">Wyloguj</button>
</div>
</div>
<div style="display: flex; align-items: center;">
<button type="button" aria-haspopup="dialog" aria-expanded="{{sheetExpanded}}" onClick="{{openSheet}}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid {{t.line}}; border-radius: 10px; background: {{t.surface}}; color: {{t.fg}}; font: inherit; font-size: 15px; font-weight: 600;">{{title}} <span style="font-weight: 500; font-size: 13px; color: {{t.muted}};">{{currentCount}}</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</div>
<main style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 24px;">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
<h1 style="margin: 0; font-family: ui-serif, Georgia, 'Times New Roman', serif; font-size: 30px; font-weight: 600; line-height: 1.2;">{{title}}</h1>
<span style="font-size: 14px; color: {{t.muted}};">{{countLabel}}</span>
</div>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 12px;">
<sc-if value="{{showHeads}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: baseline; gap: 10px; border-top: 1px solid {{t.line}}; padding-top: 12px;">
<h2 style="margin: 0; font-family: ui-serif, Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 600;">{{s.name}}</h2>
<span style="font-size: 13px; color: {{t.muted}};">{{s.countLabel}}</span>
</div>
</sc-if>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<sc-for list="{{s.items}}" as="item" hint-placeholder-count="2">
<li style="display: flex; gap: 14px; padding: 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; min-width: 0;">
<div style="flex: 0 0 88px; height: 88px; border-radius: 10px; background: {{t.tile}}; color: #8a8285; display: flex; align-items: center; justify-content: center;">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<h3 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35;"><a href="{{item.url}}" style="color: {{t.fg}}; text-decoration: none;">{{item.title}}</a></h3>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{item.price}}</span>
<p style="margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: {{t.muted}};">Znajdź w: <a href="{{item.url}}" style="color: {{t.muted}}; text-underline-offset: 3px;">{{item.shop}}</a> · <a href="{{item.ceneo}}" style="color: {{t.muted}}; text-underline-offset: 3px;">Ceneo</a> · <a href="{{item.allegro}}" style="color: {{t.muted}}; text-underline-offset: 3px;">Allegro</a> · <a href="{{item.google}}" style="color: {{t.muted}}; text-underline-offset: 3px;">Google Shopping</a></p>
</div>
<button type="button" aria-label="Edytuj pozycję" style="flex: 0 0 44px; height: 44px; margin: -8px -8px 0 0; border-radius: 8px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
</button>
</li>
</sc-for>
</ul>
</section>
</sc-for>
</main>
<button type="button" style="position: absolute; right: 16px; bottom: 16px; height: 56px; padding: 0 22px 0 16px; border-radius: 999px; border: 0; background: {{t.acc}}; color: {{t.onAcc}}; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgb(0 0 0 / 0.28);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Dodaj
</button>
<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end;">
<button type="button" aria-label="Zamknij" tabindex="-1" onClick="{{closeSheet}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgb(0 0 0 / 0.55);"></button>
<div role="dialog" aria-modal="true" aria-label="Zakładki" style="position: relative; background: {{t.surface}}; border-radius: 18px 18px 0 0; padding: 6px 8px 28px; max-height: 72%; display: flex; flex-direction: column; box-shadow: 0 -8px 24px rgb(0 0 0 / 0.25);">
<div style="width: 36px; height: 4px; border-radius: 2px; background: {{t.muted}}; opacity: 0.5; margin: 4px auto 6px;"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 4px 12px;">
<h2 style="margin: 0; font-size: 17px; font-weight: 600;">Zakładki</h2>
<button type="button" onClick="{{closeSheet}}" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{t.muted}}; font: inherit; font-size: 15px;">Zamknij</button>
</div>
<ul style="list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 4px;">
<button type="button" aria-current="{{n.ariaCurrent}}" onClick="{{n.select}}" style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; padding: 0 12px; border: 0; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}; font: inherit; font-size: 16px; font-weight: {{n.weight}}; text-align: left;"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{n.name}}</span><span style="font-size: 14px; font-weight: 500;">{{n.count}}</span></button>
<sc-if value="{{n.editable}}" hint-placeholder-val="{{true}}">
<button type="button" aria-label="{{n.editLabel}}" style="flex: 0 0 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
</sc-if>
<sc-if value="{{n.noEdit}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="flex: 0 0 44px;"></span>
</sc-if>
</li>
</sc-for>
</ul>
<button type="button" style="margin-top: 6px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border: 0; border-top: 1px solid {{t.line}}; border-radius: 0; background: transparent; color: {{t.fg}}; font: inherit; font-size: 16px; text-align: left;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg> Nowa zakładka</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const P = {
light: { bg: '#fbf7f8', side: '#f3ecef', surface: '#ffffff', tile: '#f6f2f3', fg: '#221c1f', muted: '#6b6466', line: '#eadfe4', acc: '#b33c72', onAcc: '#ffffff', chipBg: '#f6e4ec', chipFg: '#7d2f52' },
dark: { bg: '#171516', side: '#201d1f', surface: '#221f21', tile: '#ece7e9', fg: '#f2ecef', muted: '#a9a1a4', line: '#352f32', acc: '#f0a6c8', onAcc: '#171516', chipBg: '#3b2a32', chipFg: '#f3d5e2' }
};
const t = (this.props.dark ?? true) ? P.dark : P.light;
const links = (i) => {
const q = encodeURIComponent(i.title);
return { ...i, ceneo: 'https://www.ceneo.pl/;szukaj-' + q, allegro: 'https://allegro.pl/listing?string=' + q, google: 'https://www.google.com/search?tbm=shop&q=' + q };
};
const ph = (n) => ({ id: 'z' + n, name: '[Zakładka ' + n + ']', items: [{ title: '[Pozycja]', price: '[cena]', shop: '[sklep]', url: '#' }].map(links) });
const tabs = [
{ id: 'przyklad', name: 'Przykład', items: [
{ title: 'Książka A', price: '49,99 zł', shop: 'shop.example', url: 'https://shop.example/' },
{ title: 'Kubek z długą nazwą, żeby sprawdzić zawijanie tytułu', price: '29,00 €', shop: 'sklep.example', url: 'https://sklep.example/' }
].map(links) }
].concat([2, 3, 4, 5, 6, 7].map(ph));
const plural = (n) => n === 1 ? '1 pozycja' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? n + ' pozycje' : n + ' pozycji';
const s = this.state || {};
const view = s.view || 'all';
const menuOpen = !!s.menuOpen;
const sheetOpen = s.sheetOpen !== false;
const screen = s.screen || 'list';
const more = !!s.more;
const total = tabs.reduce((a, x) => a + x.items.length, 0);
const navSrc = [{ id: 'all', name: 'Wszystko', count: total }].concat(tabs.map((x) => ({ id: x.id, name: x.name, count: x.items.length })));
const nav = navSrc.map((n, i) => {
const on = n.id === view;
const tab = n.id !== 'all';
return { ...n, ariaCurrent: on ? 'page' : 'false', bg: on ? t.chipBg : 'transparent', fg: on ? t.chipFg : t.fg, border: on ? t.chipBg : t.line, weight: on ? 600 : 400, listWeight: tab ? 400 : 600, sep: i === 0 ? 'transparent' : t.line, editable: tab, noEdit: !tab, editLabel: 'Edytuj zakładkę „' + n.name + '”',
select: () => this.setState({ view: n.id, menuOpen: false, sheetOpen: false }),
open: () => this.setState({ view: n.id, screen: 'content', menuOpen: false }) };
});
const LIMIT = 4;
const hidden = Math.max(0, nav.length - LIMIT);
const chips = more ? nav : nav.slice(0, LIMIT);
const shown = view === 'all' ? tabs : tabs.filter((x) => x.id === view);
const sections = shown.map((x) => ({ ...x, countLabel: plural(x.items.length) }));
const current = tabs.find((x) => x.id === view);
const count = shown.reduce((a, x) => a + x.items.length, 0);
return {
t, nav, sections, chips,
title: current ? current.name : 'Wszystko',
countLabel: plural(count),
currentCount: String(count),
showHeads: view === 'all',
singleTab: view !== 'all',
menuOpen, menuExpanded: menuOpen ? 'true' : 'false',
toggleMenu: () => this.setState({ menuOpen: !menuOpen }),
sheetOpen, sheetExpanded: sheetOpen ? 'true' : 'false',
openSheet: () => this.setState({ sheetOpen: true }),
closeSheet: () => this.setState({ sheetOpen: false }),
onList: screen === 'list', onContent: screen === 'content',
back: () => this.setState({ screen: 'list', menuOpen: false }),
hasMore: hidden > 0, moreExpanded: more ? 'true' : 'false',
moreLabel: more ? 'Mniej' : '+' + hidden + ' więcej',
toggleMore: () => this.setState({ more: !more })
};
}
}
</script>
</body>
</html>
