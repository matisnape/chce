<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>chce</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="wide">
    <section id="loading">Ładowanie…</section>

    <form id="gate" hidden>
      <h1>chce</h1>
      <label for="password">Hasło</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Wejdź</button>
      <p id="gate-error" class="error" hidden></p>
      <button id="owner-login" type="button" class="link">Właścicielka? Zaloguj przez Google</button>
    </form>

    <div id="list" hidden>
      <header id="topbar">
        <button id="sidebar-toggle" type="button" class="icon-btn bordered" aria-label="Panel zakładek" aria-controls="sidebar" aria-expanded="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <span class="brand brand-top"><img src="favicon.svg" alt="" width="26" height="26"><span class="brand-name"></span></span>
        <div id="view-head">
          <h1 id="view-title">Wszystko</h1>
          <span id="view-count"></span>
        </div>
        <div class="top-links">
          <a id="bookmarklet-link" class="owner-only" href="bookmarklet.html">Bookmarklet</a>
          <button id="logout" type="button" class="link" hidden>Wyloguj</button>
        </div>
      </header>

      <aside id="sidebar">
        <span class="brand brand-side"><img src="favicon.svg" alt="" width="28" height="28"><span class="brand-name"></span></span>
        <div class="side-head">
          <span class="side-label">Zakładki</span>
          <button id="tabs-menu-btn" type="button" class="icon-btn owner-only" aria-label="Opcje zakładek" aria-haspopup="menu" aria-expanded="false" aria-controls="tabs-menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
          <div id="tabs-menu" role="menu" hidden>
            <button id="edit-tab" type="button" role="menuitem" hidden></button>
            <button id="add-tab" type="button" role="menuitem">Nowa zakładka</button>
          </div>
        </div>
        <nav id="tabs" aria-label="Zakładki"></nav>
      </aside>

      <div id="content">
        <p id="tab-description"></p>
        <div id="sections"></div>
        <p id="empty" hidden>Pusto.</p>
      </div>

      <button id="add-item" type="button" class="fab owner-only" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Dodaj
      </button>
    </div>
  </main>

  <dialog id="tab-dialog">
    <form id="tab-form">
      <h2>Zakładka</h2>
      <label>Nazwa <input name="name" required maxlength="60"></label>
      <label>Opis <textarea name="description" rows="2" maxlength="500"></textarea></label>
      <div class="actions">
        <button type="submit">Zapisz</button>
        <button type="button" class="secondary" data-cancel>Anuluj</button>
        <button id="tab-delete" type="button" class="danger" hidden>Usuń</button>
      </div>
    </form>
  </dialog>

  <dialog id="item-dialog">
    <form id="item-form">
      <h2>Pozycja</h2>
      <label>Tytuł <input name="title" required maxlength="200"></label>
      <label>Link do sklepu <input name="url" type="url" placeholder="https://"></label>
      <label>Link do zdjęcia <input name="imageUrl" type="url" placeholder="https://"></label>
      <div class="row">
        <label>Cena <input name="price" inputmode="decimal"></label>
        <label>Waluta <input name="currency" maxlength="3" value="PLN"></label>
      </div>
      <label>Opis <textarea name="description" rows="3" maxlength="2000"></textarea></label>
      <label>Zakładka <select name="tabId"></select></label>
      <div class="actions">
        <button type="submit">Zapisz</button>
        <button type="button" class="secondary" data-cancel>Anuluj</button>
        <button id="item-delete" type="button" class="danger" hidden>Usuń</button>
      </div>
    </form>
  </dialog>
</body>
</html>
