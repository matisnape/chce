# Temporary investigation workflow; removed after one run.
name: probe
on:
  push:
    branches: [claude/github-access-rq13ym]
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - run: npm install --no-save linkedom@0.18.15
      - name: extract() on the real page
        run: node .github/probe/real.mjs
      - name: link detection on old vs new hash
        run: swift .github/probe/detect.swift
      - name: try signing the rebuilt shortcuts here
        run: |
          mkdir -p build out
          node scripts/build-shortcut.mjs build
          shortcuts sign --mode anyone --input build/chce-unsigned.shortcut --output out/chce.shortcut
          shortcuts sign --mode anyone --input build/chce-dev-unsigned.shortcut --output out/chce-dev.shortcut
          cp out/*.shortcut . && node tests/shortcut.test.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signed
          path: out/
          if-no-files-found: ignore
